
<html>
<head>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- おにぎりの形状を作る -->
  <script>
    AFRAME.registerComponent('onigiri', {
      init: function () {

        const geometry = new THREE.BufferGeometry();

        // おにぎりの頂点
        const vertices = new Float32Array([
          -1, 0, 0.45,
           1, 0, 0.45,
           0, 1.7, 0.45,

          -1, 0, -0.45,
           1, 0, -0.45,
           0, 1.7, -0.45
        ]);

        // 頂点をつないで面を作る
        const indices = [
          0, 1, 2,
          3, 5, 4,

          0, 3, 4,
          0, 4, 1,

          1, 4, 5,
          1, 5, 2,

          2, 5, 3,
          2, 3, 0
        ];

        geometry.setAttribute(
          'position',
          new THREE.BufferAttribute(vertices, 3)
        );

        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        // ご飯の色
        const material = new THREE.MeshStandardMaterial({
          color: '#F5EBD0',
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);

        this.el.setObject3D('mesh', mesh);
      }
    });
  </script>
</head>

<body>

  <a-scene>

    <!-- 床 -->
  <a-plane
    position="0 0 -4"
    rotation="-90 0 0"
    width="4"
    height="4"
    color="#7BC8A4">
  </a-plane>

  <!-- おにぎり本体 -->
  <a-entity
    onigiri
    position="0 0.4 -3">
  </a-entity>

  <!-- おにぎりの海苔 -->
  <a-box
    position="0 0.8 -2.53"
    width="1.4"
    height="0.5"
    depth="0.03"
    color="#153B20">
  </a-box>

  <!-- ご飯の粒 -->
  <a-sphere
    position="-0.25 1.25 -2.52"
    radius="0.035"
    color="#FFFFFF">
  </a-sphere>

  <a-sphere
    position="0.05 1.4 -2.52"
    radius="0.035"
    color="#FFFFFF">
  </a-sphere>

  <a-sphere
    position="0.25 1.15 -2.52"
    radius="0.035"
    color="#FFFFFF">
  </a-sphere>

  <!-- 背景 -->
  <a-sky color="#ECECEC"></a-sky>

  </a-scene>

</body>
</html>
